<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Formulário</title>
        <style>
                body{
                        font-family:poppins;
                        background-image: linear-gradient(to right ,rgb(20,147,220),rgb(17,54,71));
                }
                .box{
                position: absolute;
                top:50%;
                left:50%;
                transform: translate(-50%,-50%);
                color:#fff;
                background-color: rgba(0,0,0,0.8);
                padding:15px;
                border-radius:15px;
                width:100%;
                }
                fieldset{
                        border: 3px solid dodgerblue;
                }
                legend{
                        border:1px solid dodgerblue;
                        background-color: dodgerblue;
                        text-align: center;
                        border-radius: 8px;
                        color: white;
                }
                inputbox{
                        position:relative;
                }
        .inputuser{
                border:none;
                border-bottom:1px solid white;
                outline: none;
                color: white;
                font-size: 10px;
                width: 60%;
                letter-spacing: 2px;
                background: none;
                }
        .labelinput {
                position:absolute;
                transition:.5px;
        }
        #Date_nascimento{
                border-radius: 15px;
                outline: none;
                padding: 15px;
        }
        #submit{
                width:100%;
                padding: 15px;
                border-radius: 20px;
                background-image: linear-gradient(to right ,rgb(0,92,197),rgb(90,20,220));
                color: white;
                border:none;
        }
                        
        </style>
</head>
<body>
        <div class="box">
                <form action="">
                        <fieldset>
                                <legend>
        <b>Formulário para Registro</b>
                                </legend> <br>
        <div class ="inputbox">
<input type="text" name="nome" id="nome" class=" inputuser" required>
<label for="nome" class="labelinput"> Nome Completo </label> 
<br> <br>
<input type="text" name="email" id="email" class=" inputuser" required>
                <label for="email" class="labelinput">Email </label> 
                <br> <br>
<input type="number" name="telefone" id="telefone" class=" inputuser" required>
<label for="telefone" class="labelinput"> Telefone</label> 
<br> <br>
</div>
<p> Sexo:</p>
<input type="radio" name="genero" id="feminino" value="feminino" required>
<label for="feminino"> Feminino </label> <br><br> 
<input type="radio" name="genero" id="masculino" value="masculino" required> 
<label for="masculino"> Masculino </label>
         <br> <br>
        <label for="Date_nascimento"> <b> Data de Nascimento</b></label>
        <input type="date",name="Data_nascimento",     id="Date_nascimento" required>
        <br> <br>
        <br><br>
        <input type="alphanumeric" name="Bi number" id="Bi_number" class="inputuser" tequired>
        <label for="Bi_number" class="labelinput"> Numero do BI</label>
        <br> <br>
        <input type="text" name="adress" id="adress" class="inputuser" required>
<label for="adress" class="labelinput"> Seu Endereço</label>
<br> <br>
<input type="text" name="gradeshoolar" id="gradeshcoolar" class="inputuser" required>
<label for="gradeshoolar" class="labelinput"> Nível Escolar </label> <br><br>
<input type="submit" name="submit" id="submit">
     </fieldset>
            </form>
                 </div>
</body>
</html>
